name: Daily edition

on:
  schedule:
    - cron: "17 4 * * *" # 04:17 UTC daily; off the :00 mark to dodge scheduler congestion
  workflow_dispatch:
    inputs:
      force_ai:
        description: Re-summarise everything, ignoring the cache (use after changing the model)
        type: boolean
        default: false

permissions:
  contents: write # commit the new edition back; Vercel deploys on that push

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Collect sources and write today's edition
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FORCE_AI: ${{ inputs.force_ai && '1' || '' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }} # optional; defaults to gpt-6-luna
        run: npm run fetch
      - name: Render (sanity check that the site builds)
        run: npm run build
      - name: Commit edition
        run: |
          git config user.name "outpost-bot"
          git config user.email "outpost-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "edition: $(date -u +%F)"
          git pull --rebase -q
          git push
      - name: Deploy to Vercel
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: npx --yes vercel@65 deploy --prod --yes --token "$VERCEL_TOKEN"
      - name: Notify search engines (IndexNow)
        if: ${{ env.VERCEL_TOKEN != '' }}
        continue-on-error: true
        run: sleep 30 && npm run build >/dev/null && node src/indexnow.mjs
