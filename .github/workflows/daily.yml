name: Edition refresh

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes (at most 48 deploys a day, well inside the 100 Vercel Hobby allows); only deploys when something changed. The budget step is a safety net
  workflow_dispatch:
    inputs:
      force_ai:
        description: Re-summarise everything, ignoring the cache (use after changing the model)
        type: boolean
        default: false

permissions:
  contents: write # commit the new edition back
  issues: write # open an issue when the refresh fails, close it when it recovers (.github/scripts/alert.sh)

concurrency:
  group: site-data # shared with the 5-minute collector (breaking.yml)
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_VERCEL: ${{ secrets.VERCEL_TOKEN != '' }} # only whether a token exists; the token itself is given to the Deploy step alone
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy budget (Vercel Hobby allows 100 deploys a day)
        id: gate
        run: |
          # edition commits in the last 24 h stand in for deploys. Past 70, the job only runs in the first 10 minutes of each hour
          # (at most 24 more a day), so the cap is never reached and nothing is left committed but undeployed
          git fetch -q --shallow-since="24 hours ago" origin main || true
          n=$(git log --since="24 hours ago" --grep='^edition:' --oneline origin/main | wc -l | tr -d ' ')
          m=$((10#$(date -u +%M)))
          if [ "$n" -gt 70 ] && [ "$m" -ge 10 ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then echo "go=false" >> "$GITHUB_OUTPUT"; echo "budget: $n edition commits in 24 h, waiting for the hourly slot"; else echo "go=true" >> "$GITHUB_OUTPUT"; echo "budget: $n edition commits in 24 h"; fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.gate.outputs.go == 'true'
      - run: npm test
        if: steps.gate.outputs.go == 'true'
      - name: Collect sources and write today's edition
        if: steps.gate.outputs.go == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FORCE_AI: ${{ inputs.force_ai && '1' || '' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }} # optional; defaults to gpt-6-luna
        run: npm run fetch
      - name: Render (sanity check that the site builds)
        if: steps.gate.outputs.go == 'true'
        run: |
          node --version
          npm run build
      - name: Commit edition
        id: commit
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "outpost-bot"
          git config user.email "outpost-bot@users.noreply.github.com"
          git add data public/img/news
          if [ -d public/img/dw ]; then git add -A public/img/dw; fi
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "no changes"; exit 0; fi
          git commit -m "edition: $(date -u +%FT%H:%MZ)"
          # GitHub occasionally answers a push with a 5xx; retry instead of failing the whole run
          for i in 1 2 3 4; do
            git pull --rebase -q && git push && break
            git rebase --abort 2>/dev/null || true # a failed pull can leave a half-done rebase that would fail every later attempt
            [ "$i" = 4 ] && exit 1
            echo "push failed (attempt $i), retrying"; sleep $((i * 15))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy to Vercel
        if: ${{ steps.commit.outputs.changed == 'true' && env.HAS_VERCEL == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@65 deploy --prod --yes --token "$VERCEL_TOKEN"
      - name: Notify search engines (IndexNow, once a day)
        if: ${{ steps.commit.outputs.changed == 'true' && env.HAS_VERCEL == 'true' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '*/30 * * * *') }}
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$(date -u +%H)" != "04" ]; then echo "only the 04:xx UTC run pings"; exit 0; fi
          sleep 30 && npm run build >/dev/null && node src/indexnow.mjs
      - name: Alert when the refresh is failing
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash .github/scripts/alert.sh fail "Edition refresh failing" "The edition refresh failed (the site keeps serving the last good edition). Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. This issue closes itself when a run succeeds; it gets a new comment at most every 6 hours."
      - name: Close the alert when the refresh recovers
        if: success() && steps.gate.outputs.go == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash .github/scripts/alert.sh ok "Edition refresh failing" "Recovered: the edition refresh succeeded again. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
